# Fieldmate AI proxy. Secrets (never in this file): wrangler secret put ANTHROPIC_API_KEY / DEEPGRAM_API_KEY /
# ELEVENLABS_API_KEY / DEV_TOKEN. See README.md.
name = "fieldmate-proxy"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[vars]
CHAT_MODEL = "claude-haiku-4-5"
MAX_OUTPUT_TOKENS = "600"
STT_MODEL = "nova-3"
TTS_MODEL = "eleven_flash_v2_5"
# ElevenLabs free plan: 10k credits/month (~10-20k characters with Flash). Keep public TTS usage small.
# ElevenLabs voice ids, one per language (choose in the ElevenLabs voice library).
VOICE_EN = ""
VOICE_DE = ""
# Daily caps for requests without the dev token (whole Worker, UTC day).
DAILY_CHAT_CALLS = "300"
DAILY_STT_SECONDS = "1800"
DAILY_TTS_CHARS = "1500"

# Daily usage counters. Create with: wrangler kv namespace create USAGE, then paste the id here.
[[kv_namespaces]]
binding = "USAGE"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Per-IP rate limit (Workers Rate Limiting binding): 20 requests per 60 s.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 20
  period = 60
